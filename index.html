<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .box { padding: 30px; }
    .loader {
      width: 48px;
      height: 48px;
      border: 5px solid #45536b;
      border-top-color: #38d9f5;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Redirecting to your destination</h2>
    <div class="loader"></div>
    <p>Your page will open in <span id="count">5</span> seconds.</p>
    <p id="destination"></p>
  </div>

  <script>
    const target = "https://1mega-winterbigsale.icu/fxhyft655/bigdepa";
    document.getElementById("destination").textContent =
      "Destination: " + target;

    let seconds = 5;
    const timer = setInterval(() => {
      seconds--;
      document.getElementById("count").textContent = seconds;
      if (seconds <= 0) {
        clearInterval(timer);
        window.location.href = target;
      }
    }, 1000);
  </script>
</body>
</html>
